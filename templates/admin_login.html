{% extends "base.html" %}
{% block title %}Admin Login - Hotel Management{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-secondary text-white">
        <h4>Admin Login</h4>
      </div>
      <div class="card-body" style="background-image: url('{{ url_for('static', filename='images/login_bg.jpg') }}'); background-size: cover;">
        <form method="post" action="{{ url_for('admin_login') }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn btn-secondary w-100">Login as Admin</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
