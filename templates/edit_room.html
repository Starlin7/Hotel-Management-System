{% extends "base.html" %}
{% block title %}Edit Room{% endblock %}
{% block content %}
<h2>Edit Room</h2>
<form action="{{ url_for('edit_room', room_id=room.room_id) }}" method="post">
  <div class="mb-3">
    <label class="form-label">Room Number:</label>
    <input type="text" class="form-control" name="room_number" value="{{ room.room_number }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Room Type ID:</label>
    <input type="text" class="form-control" name="room_type_id" value="{{ room.room_type_id }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Floor:</label>
    <input type="number" class="form-control" name="floor" value="{{ room.floor }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Capacity:</label>
    <input type="number" class="form-control" name="capacity" value="{{ room.capacity }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Price Per Night:</label>
    <input type="number" step="0.01" class="form-control" name="price_per_night" value="{{ room.price_per_night }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Status:</label>
    <select class="form-select" name="status" required>
      <option value="Available" {% if room.status=='Available' %}selected{% endif %}>Available</option>
      <option value="Occupied" {% if room.status=='Occupied' %}selected{% endif %}>Occupied</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Update Room</button>
</form>
{% endblock %}
