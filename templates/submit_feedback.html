{% extends "base.html" %}
{% block title %}Submit Feedback{% endblock %}
{% block content %}
<h2>Submit Feedback</h2>
<form action="{{ url_for('submit_feedback') }}" method="post">
  <div class="mb-3">
    <label class="form-label">Reservation ID:</label>
    <input type="text" class="form-control" name="reservation_id" placeholder="Enter your Reservation ID" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Rating (1-5):</label>
    <input type="number" class="form-control" name="rating" min="1" max="5" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Comments:</label>
    <textarea class="form-control" name="comments" rows="4" placeholder="Your comments..." required></textarea>
  </div>
  <button type="submit" class="btn btn-success">Submit Feedback</button>
</form>
{% endblock %}
